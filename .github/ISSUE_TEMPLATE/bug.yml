name: 🐛 Bug
description: Algo que no funciona como debería
labels: ["tipo: bug"]
projects: ["TurnosDev-Team/1"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: input
    id: donde
    attributes:
      label: Dónde
      placeholder: "Celular Android / Chrome, producción"
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o errores
